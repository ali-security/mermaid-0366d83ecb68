name: Unit Tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional vitest file/name filter'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        # uses version from "packageManager" field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'

      - name: Install Packages
        run: |
          pnpm install --frozen-lockfile
        env:
          CYPRESS_CACHE_FOLDER: .cache/Cypress

      - name: Pack mermaid (as release.yml changeset:publish does)
        run: |
          pnpm copy-readme
          mkdir -p "$RUNNER_TEMP/pack-out"
          cd packages/mermaid
          pnpm pack --pack-destination "$RUNNER_TEMP/pack-out"
          ls -la "$RUNNER_TEMP/pack-out"

      - name: Upload mermaid tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mermaid-tgz
          path: ${{ runner.temp }}/pack-out/mermaid-*.tgz
          if-no-files-found: error

      - name: Run Unit Tests
        run: |
          pnpm test:coverage ${{ inputs.test-filter }}

      - name: Run ganttDb tests using California timezone
        if: ${{ inputs.test-filter == '' }}
        env:
          # Makes sure that gantt db works even in a timezone that has daylight savings
          # since some days have 25 hours instead of 24.
          TZ: America/Los_Angeles
        run: |
          pnpm exec vitest run ./packages/mermaid/src/diagrams/gantt/ganttDb.spec.ts

      - name: Report skipped / todo / pending tests and why
        if: ${{ inputs.test-filter == '' }}
        run: |
          echo "Every skipped, todo or pending test in the Vitest and Cypress runs is disabled"
          echo "statically by upstream in its own test source at this release tag (it.skip /"
          echo "describe.skip / test.skip / it.todo); nothing is skipped by this build."
          echo "Exception: ganttDb.spec.ts 'describe.skipIf(TZ != America/Los_Angeles)' is skipped in"
          echo "the main run only because it needs that timezone; the step above re-runs it with"
          echo "TZ=America/Los_Angeles, where it executes and passes."
          echo
          echo "Reason: upstream disabled each one in source (known-unsupported syntax, an"
          echo "unimplemented feature, or a placeholder todo) — listed with file:line:"
          grep -rnE "\b(it|test|describe)\.(skip|todo|skipIf)\(|\bxit\(" \
            --include='*.spec.*' --include='*.test.*' packages cypress \
            | grep -v node_modules | grep -vE ':[0-9]+:\s*//'

      - name: Verify out-of-tree build with TypeScript
        run: |
          pnpm test:check:tsc

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@13ce06bfc6bbe3ecf90edbbf1bc32fe5978ca1d3 # v5.3.1
        # Run step only pushes to develop and pull_requests
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}
        with:
          files: ./coverage/vitest/lcov.info
          flags: unit
          name: mermaid-codecov
          fail_ci_if_error: false
          verbose: true
          token: 6845cc80-77ee-4e17-85a1-026cd95e0766
